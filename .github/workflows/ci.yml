name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: swift build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: swift-format (optional)
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            swift-format lint --recursive Packages App Packages
          else
            echo "swift-format not installed; skipping"
          fi

      - name: Release strings script syntax
        run: bash -n scripts/check-release-strings.sh
