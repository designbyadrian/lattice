name: Lattice
options:
  bundleIdPrefix: com.designbyadrian
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ONLY_ACTIVE_ARCH: YES
packages:
  Lattice:
    path: .
targets:
  Lattice:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.designbyadrian.lattice
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: App/Lattice.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - package: Lattice
        product: AppCore
      - package: Lattice
        product: Config
      - package: Lattice
        product: PlatformMac
      - package: Lattice
        product: LayoutModel
      - package: Lattice
        product: LayoutEngine
      - package: Lattice
        product: Platform
    scheme:
      testTargets: []
